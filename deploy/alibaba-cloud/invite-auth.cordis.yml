- insert:
    - id: invite-auth
      name: '@deepseek-ai/dsh-host-invite-auth'
      config:
        inviteCodeEnv: DSH_INVITE_CODE_SECRET
        sessionSecretEnv: DSH_INVITE_SESSION_SECRET
        sessionTtlSeconds: 2592000
        failureWindowSeconds: 900
        maxFailuresPerWindow: 10
        maxTrackedAddresses: 10000
        maxBodyBytes: 4096
- id: web-runtime
  inject: [webStartup, inviteAuthReadiness]
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
- id: api-gateway
  config:
    maxEventStreamQueueFrames: 4096
- id: connection
  inject: [webRuntime]
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    downlinkBatching: true
    downlinkBatchMaxFrames: 64
    downlinkBatchMaxBytes: 262144
    downlinkBatchFlushMs: 16
    downlinkCompression: true
    downlinkCompressionThresholdBytes: 0
    downlinkCompressionConcurrency: 4
    downlinkMaxBufferedBytes: 1048576
    downlinkSendTimeoutMs: 5000
